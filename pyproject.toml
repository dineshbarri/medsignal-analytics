[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsignal-analytics"
version = "1.0.0"
description = "Reproducible pharmacovigilance analytics for public adverse-event reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dinesh Barri"}]
dependencies = ["pandas>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
analysis = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "scipy>=1.12",
    "seaborn>=0.13",
    "sqlalchemy>=2.0",
]

[project.scripts]
medsignal = "medsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
